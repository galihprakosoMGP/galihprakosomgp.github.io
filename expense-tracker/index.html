<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spendly – Expense Tracker</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>tailwind.config={darkMode:'class'}</script>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen">
<div class="max-w-5xl mx-auto px-4 py-6 sm:py-10">

  <header class="flex items-center justify-between mb-6">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-indigo-600 text-white grid place-items-center text-lg font-bold">$</div>
      <div>
        <h1 class="text-xl font-bold leading-tight">Spendly</h1>
        <p class="text-xs text-slate-500 dark:text-slate-400" id="monthLabel"></p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button id="themeBtn" aria-label="Toggle theme" class="w-10 h-10 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 grid place-items-center hover:bg-slate-100 dark:hover:bg-slate-800"></button>
      <button id="exportBtn" aria-label="Export table" class="h-10 px-3 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 hover:bg-slate-100 dark:hover:bg-slate-800 text-sm font-medium flex items-center gap-2">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6M6 18H4v-7h16v7h-2M6 14h12v7H6z"/></svg>
        <span class="hidden sm:inline">Export</span>
      </button>
      <button id="addBtn" class="h-10 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-medium flex items-center gap-2 shadow-sm">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        <span class="hidden sm:inline">Add transaction</span><span class="sm:hidden">Add</span>
      </button>
    </div>
  </header>

  <!-- Summary cards -->
  <section class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6" id="cards"></section>

  <section class="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-6">
    <div class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-5">
      <h2 class="font-semibold mb-4">Spending by category <span class="text-xs font-normal text-slate-500">(this month)</span></h2>
      <div id="breakdown"></div>
    </div>
    <div class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-5">
      <h2 class="font-semibold mb-4">Recent transactions</h2>
      <div id="recent"></div>
    </div>
  </section>

  <!-- All transactions -->
  <section class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-5">
    <div class="flex flex-col md:flex-row md:items-center gap-3 mb-4">
      <h2 class="font-semibold md:mr-auto">All transactions <span id="count" class="text-xs font-normal text-slate-500"></span></h2>
      <input id="search" type="search" placeholder="Search description…" class="w-full md:w-56 h-10 px-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 text-sm outline-none focus:ring-2 focus:ring-indigo-500">
      <div class="flex gap-2">
        <select id="fCat" class="flex-1 h-10 px-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 text-sm outline-none focus:ring-2 focus:ring-indigo-500"></select>
        <select id="fType" class="flex-1 h-10 px-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 text-sm outline-none focus:ring-2 focus:ring-indigo-500">
          <option value="all">All types</option><option value="expense">Expenses</option><option value="income">Income</option>
        </select>
      </div>
    </div>
    <div id="list"></div>
  </section>

  <p class="text-center text-xs text-slate-400 mt-6">Data is stored only in this browser (localStorage).</p>
</div>

<!-- Add/Edit modal -->
<div id="modal" class="hidden fixed inset-0 z-40 bg-black/50 items-end sm:items-center justify-center p-0 sm:p-4">
  <div class="w-full sm:max-w-md bg-white dark:bg-slate-900 rounded-t-2xl sm:rounded-2xl p-5 shadow-xl max-h-full overflow-y-auto" role="dialog" aria-modal="true">
    <div class="flex items-center justify-between mb-4">
      <h3 id="modalTitle" class="font-semibold text-lg">Add transaction</h3>
      <button id="closeBtn" aria-label="Close" class="w-8 h-8 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 text-xl leading-none">×</button>
    </div>
    <form id="form" class="space-y-4" novalidate>
      <div class="grid grid-cols-2 gap-2 p-1 rounded-xl bg-slate-100 dark:bg-slate-800" id="typeToggle">
        <button type="button" data-type="expense" class="h-9 rounded-lg text-sm font-medium">Expense</button>
        <button type="button" data-type="income" class="h-9 rounded-lg text-sm font-medium">Income</button>
      </div>
      <div>
        <label class="text-sm font-medium" for="amount">Amount</label>
        <input id="amount" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0.00" class="mt-1 w-full h-11 px-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 outline-none focus:ring-2 focus:ring-indigo-500">
      </div>
      <div>
        <label class="text-sm font-medium" for="desc">Description</label>
        <input id="desc" type="text" maxlength="80" placeholder="e.g. Groceries" class="mt-1 w-full h-11 px-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 outline-none focus:ring-2 focus:ring-indigo-500">
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-sm font-medium" for="cat">Category</label>
          <select id="cat" class="mt-1 w-full h-11 px-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 outline-none focus:ring-2 focus:ring-indigo-500"></select>
        </div>
        <div>
          <label class="text-sm font-medium" for="date">Date</label>
          <input id="date" type="date" class="mt-1 w-full h-11 px-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
      </div>
      <p id="err" class="text-sm text-rose-500 hidden"></p>
      <button type="submit" class="w-full h-11 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-medium">Save</button>
    </form>
  </div>
</div>

<!-- Export / print report -->
<div id="reportModal" class="hidden fixed inset-0 z-40 bg-black/50 items-center justify-center p-0 sm:p-4">
  <div id="reportBox" class="w-full sm:max-w-3xl bg-white text-slate-900 rounded-none sm:rounded-2xl shadow-xl max-h-full flex flex-col">
    <div class="no-print flex flex-wrap items-center gap-2 p-4 border-b border-slate-200">
      <h3 class="font-semibold mr-auto">Export preview</h3>
      <select id="rScope" class="h-10 px-3 rounded-xl border border-slate-300 bg-white text-sm text-slate-900 outline-none focus:ring-2 focus:ring-indigo-500">
        <option value="all">All transactions</option>
        <option value="month">This month</option>
        <option value="filtered">Current filters</option>
      </select>
      <button id="printBtn" class="h-10 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium disabled:opacity-40 disabled:cursor-not-allowed">Print / Save as PDF</button>
      <button id="rClose" class="h-10 px-3 rounded-xl border border-slate-300 text-sm hover:bg-slate-100">Close</button>
    </div>
    <div id="reportBody" class="p-6 overflow-y-auto"></div>
  </div>
</div>

<!-- Delete confirm -->
<div id="confirm" class="hidden fixed inset-0 z-50 bg-black/50 items-center justify-center p-4">
  <div class="w-full max-w-sm bg-white dark:bg-slate-900 rounded-2xl p-5 shadow-xl">
    <h3 class="font-semibold text-lg">Delete transaction?</h3>
    <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">This can't be undone.</p>
    <div class="flex gap-2 mt-5">
      <button id="cancelDel" class="flex-1 h-10 rounded-xl border border-slate-200 dark:border-slate-700">Cancel</button>
      <button id="okDel" class="flex-1 h-10 rounded-xl bg-rose-600 hover:bg-rose-500 text-white font-medium">Delete</button>
    </div>
  </div>
</div>

<div id="toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-xl bg-slate-900 text-white text-sm shadow-lg dark:bg-white dark:text-slate-900"></div>

<script src="js/app.js"></script>
</body>
</html>
